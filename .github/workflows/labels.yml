name: Labels
on:
  workflow_dispatch:

jobs:
  backport:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    name: Backport label added
    # Seal: this job asserts a "backport" label on the triggering pull request.
    # The fork only ever dispatches workflows manually, so there is no pull
    # request in the event payload and the job can never do anything but error.
    # Disabled the same way `lint` is in ci-cd.yml; it builds nothing and tests
    # nothing.
    if: false
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            if (!pr.data.labels.find(l => l.name.startsWith("backport")))
              process.exit(1);
